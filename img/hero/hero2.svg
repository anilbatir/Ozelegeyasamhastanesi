<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="bg2" x1="10%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#094f4c"/>
      <stop offset="55%" stop-color="#0d6e6a"/>
      <stop offset="100%" stop-color="#0a3e3b"/>
    </linearGradient>
    <radialGradient id="glow2" cx="82%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg2)"/>
  <rect width="1600" height="700" fill="url(#glow2)"/>

  <g fill="#ffffff" opacity="0.08">
    <circle cx="140" cy="600" r="3"/><circle cx="190" cy="600" r="3"/><circle cx="240" cy="600" r="3"/>
    <circle cx="140" cy="650" r="3"/><circle cx="190" cy="650" r="3"/><circle cx="240" cy="650" r="3"/>
  </g>

  <circle cx="1120" cy="150" r="60" fill="#e98a4e" opacity="0.2"/>
  <circle cx="1420" cy="500" r="40" fill="#ffffff" opacity="0.12"/>
  <circle cx="1350" cy="150" r="24" fill="#14a89f" opacity="0.3"/>

  <!-- consultation table -->
  <ellipse cx="1220" cy="510" rx="230" ry="34" fill="#ffffff" opacity="0.10"/>

  <!-- shield with check: SGK / insurance -->
  <g transform="translate(1240,250)">
    <path d="M0 -110 L96 -70 L96 20 C96 100 48 150 0 170 C-48 150 -96 100 -96 20 L-96 -70 Z"
          fill="#ffffff" opacity="0.14" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M-38 10 L-10 42 L46 -34" fill="none" stroke="#ffffff" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- two seated figures facing each other -->
  <g>
    <circle cx="1010" cy="410" r="30" fill="#ffffff" opacity="0.85"/>
    <path d="M955 500 q0 -55 55 -55 q55 0 55 55 z" fill="#ffffff" opacity="0.85"/>
  </g>
  <g>
    <circle cx="1430" cy="410" r="30" fill="#ffffff" opacity="0.7"/>
    <path d="M1375 500 q0 -55 55 -55 q55 0 55 55 z" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- small id/insurance card floating -->
  <g transform="translate(1020,290) rotate(-8)">
    <rect x="-46" y="-30" width="92" height="60" rx="8" fill="#ffffff" opacity="0.85"/>
    <circle cx="-22" cy="-6" r="9" fill="#0d6e6a" opacity="0.6"/>
    <rect x="-4" y="-10" width="36" height="6" rx="3" fill="#0d6e6a" opacity="0.5"/>
    <rect x="-4" y="2" width="26" height="6" rx="3" fill="#0d6e6a" opacity="0.4"/>
  </g>
</svg>
