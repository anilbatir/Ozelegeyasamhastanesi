<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="10%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3e3b"/>
      <stop offset="50%" stop-color="#0d6e6a"/>
      <stop offset="100%" stop-color="#094f4c"/>
    </linearGradient>
    <radialGradient id="glow3" cx="80%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#14a89f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#14a89f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg3)"/>
  <rect width="1600" height="700" fill="url(#glow3)"/>

  <!-- tech grid dots -->
  <g fill="#ffffff" opacity="0.10">
    <circle cx="1500" cy="120" r="3"/><circle cx="1540" cy="120" r="3"/><circle cx="1580" cy="120" r="3"/>
    <circle cx="1500" cy="160" r="3"/><circle cx="1540" cy="160" r="3"/><circle cx="1580" cy="160" r="3"/>
    <circle cx="1500" cy="200" r="3"/><circle cx="1540" cy="200" r="3"/><circle cx="1580" cy="200" r="3"/>
  </g>

  <circle cx="1150" cy="590" r="50" fill="#e98a4e" opacity="0.18"/>
  <circle cx="1430" cy="140" r="30" fill="#ffffff" opacity="0.12"/>

  <!-- scanner / MRI ring -->
  <g transform="translate(1220,350)">
    <circle r="190" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="26"/>
    <circle r="190" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" stroke-dasharray="10 14"/>
    <circle r="130" fill="#ffffff" opacity="0.06"/>
    <circle r="130" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- scan table -->
  <rect x="980" y="500" width="480" height="26" rx="13" fill="#ffffff" opacity="0.16"/>
  <rect x="1040" y="480" width="200" height="30" rx="15" fill="#ffffff" opacity="0.12"/>

  <!-- pulse waveform through the ring -->
  <path d="M960 350 L1080 350 L1120 260 L1170 440 L1220 300 L1260 350 L1480 350"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- small readout panel -->
  <g transform="translate(1000,220)">
    <rect x="-60" y="-40" width="120" height="80" rx="10" fill="#ffffff" opacity="0.85"/>
    <path d="M-40 6 L-24 6 L-14 -14 L2 22 L16 -6 L40 -6" fill="none" stroke="#0d6e6a" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
</svg>
