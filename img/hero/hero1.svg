<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3e3b"/>
      <stop offset="55%" stop-color="#0d6e6a"/>
      <stop offset="100%" stop-color="#14a89f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="78%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="700" fill="url(#bg1)"/>
  <rect width="1600" height="700" fill="url(#glow1)"/>

  <!-- subtle dot texture -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="120" cy="90" r="3"/><circle cx="170" cy="90" r="3"/><circle cx="220" cy="90" r="3"/>
    <circle cx="120" cy="140" r="3"/><circle cx="170" cy="140" r="3"/><circle cx="220" cy="140" r="3"/>
    <circle cx="1480" cy="600" r="3"/><circle cx="1430" cy="600" r="3"/><circle cx="1380" cy="600" r="3"/>
    <circle cx="1480" cy="650" r="3"/><circle cx="1430" cy="650" r="3"/><circle cx="1380" cy="650" r="3"/>
  </g>

  <!-- floating accent blobs -->
  <circle cx="1180" cy="120" r="70" fill="#e98a4e" opacity="0.22"/>
  <circle cx="1360" cy="230" r="34" fill="#ffffff" opacity="0.14"/>
  <circle cx="1050" cy="560" r="46" fill="#14a89f" opacity="0.25"/>

  <!-- reception desk -->
  <rect x="980" y="430" width="480" height="150" rx="24" fill="#ffffff" opacity="0.10"/>
  <rect x="980" y="430" width="480" height="34" rx="17" fill="#ffffff" opacity="0.16"/>

  <!-- medical cross medallion -->
  <circle cx="1230" cy="300" r="86" fill="#ffffff" opacity="0.14"/>
  <circle cx="1230" cy="300" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="1206" y="258" width="48" height="84" rx="10" fill="#ffffff" opacity="0.85"/>
  <rect x="1188" y="276" width="84" height="48" rx="10" fill="#ffffff" opacity="0.85"/>

  <!-- figure 1: staff behind desk -->
  <g>
    <circle cx="1080" cy="360" r="34" fill="#ffffff" opacity="0.9"/>
    <path d="M1010 470 q0 -70 70 -70 q70 0 70 70 z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- figure 2: patient in front of desk -->
  <g>
    <circle cx="1300" cy="410" r="30" fill="#ffffff" opacity="0.75"/>
    <path d="M1240 520 q0 -62 60 -62 q60 0 60 62 z" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- soft heartbeat line accent, subtle -->
  <path d="M120 560 L260 560 L300 480 L350 640 L400 500 L440 560 L620 560"
        fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
